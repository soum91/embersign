name: Build EmberSign

on:
  push:
    branches: [main, watch-native, feature/zeus-parity-no-containers, feature/iphone13-target, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embersign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the signing engine's tested Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version
      - name: Test pairing and entitlement policies
        continue-on-error: true
        run: swift test
      - name: Test FlareStore feed generation
        continue-on-error: true
        run: python3 -m unittest discover -s Tests -p 'test_source_feed.py'
      - name: Fetch pinned signing engine and apply EmberSign source
        run: bash scripts/bootstrap.sh
      - name: Verify the Remote iPhone tool is in the generated app
        run: |
          python3 -c 'from pathlib import Path; t=Path("upstream/Feather/Ember/EmberToolsView.swift").read_text(); assert "Remote iPhone (Wi-Fi)" in t and "EmberInstallTargetView()" in t'
      - name: Install Rust target for on-device pairing
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Restore compiled dependencies
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.3-build-${{ hashFiles('upstream.lock.json', 'project.yml', 'overrides/**', 'scripts/prepare.py', 'pairing-native/**', 'jit-integration/**') }}
      - name: Build and package IPA
        run: bash scripts/build.sh
      - name: Preserve compiled dependencies
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.3-build-${{ hashFiles('upstream.lock.json', 'project.yml', 'overrides/**', 'scripts/prepare.py', 'pairing-native/**', 'jit-integration/**') }}
      - name: Name IPA with build number
        run: |
          N=${{ github.run_number }}
          cp packages/EmberSign.ipa "packages/EmberSign-build-$N.ipa"
          (cd packages && shasum -a 256 "EmberSign-build-$N.ipa" > "EmberSign-build-$N.ipa.sha256")
      - name: Write changelog since the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_changelog.py
      - name: Prepare FlareStore feed for the packaged IPA
        run: python3 scripts/update_source.py
      - name: Bundle complete source with licenses
        run: |
          cp README.md upstream/EMBERSIGN-README.md
          cp NOTICE.md upstream/EMBERSIGN-NOTICE.md
          mkdir -p upstream/EmberSign-Pairing-Native
          cp pairing-native/Cargo.toml pairing-native/LICENSE upstream/EmberSign-Pairing-Native/
          cp -R pairing-native/src pairing-native/include upstream/EmberSign-Pairing-Native/
          cp scripts/build_pairing.sh upstream/EmberSign-Pairing-Native/
          mkdir -p upstream/EmberSign-StikJIT-Source
          cp build/stikjit-source/LICENSE build/stikjit-source/README.md build/stikjit-source/project.yml upstream/EmberSign-StikJIT-Source/
          cp -R build/stikjit-source/Sources build/stikjit-source/Resources build/stikjit-source/idevice build/stikjit-source/iokit upstream/EmberSign-StikJIT-Source/
          cp scripts/build_stikjit.sh upstream/EmberSign-StikJIT-Source/
          tar --exclude='.git' --exclude='_build' --exclude='deps' -czf packages/EmberSign-Source.tar.gz -C upstream .
      - name: Upload build files and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmberSign-build-${{ github.run_number }}
          path: packages/*
          if-no-files-found: warn
      - name: Publish installable package for personal signing
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1-build.${{ github.run_number }}
          name: EmberSign 0.2.1 build ${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: true
          body_path: packages/RELEASE_NOTES.md
          files: |
            packages/EmberSign-build-${{ github.run_number }}.ipa
            packages/EmberSign-build-${{ github.run_number }}.ipa.sha256
            packages/build-info.json
            packages/EmberSign-Source.tar.gz
      - name: Update FlareStore feed after successful release
        if: github.ref == 'refs/heads/main'
        run: |
          git add source.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Update FlareStore feed for build ${{ github.run_number }} [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git -c rebase.autoStash=true rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
