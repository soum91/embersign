name: Build EmberSign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embersign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the signing engine's tested Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version
      - name: Test pairing and entitlement policies
        run: swift test
      - name: Test FlareStore feed generation
        run: python3 -m unittest discover -s Tests -p 'test_source_feed.py'
      - name: Fetch pinned signing engine and apply EmberSign source
        run: bash scripts/bootstrap.sh
      - name: Install Rust target for on-device pairing
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Restore compiled dependencies
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.3-build-${{ hashFiles('upstream.lock.json', 'project.yml', 'pairing-native/**', 'jit-integration/**') }}
      - name: Build and package IPA
        run: bash scripts/build.sh
      - name: Preserve compiled dependencies
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.3-build-${{ hashFiles('upstream.lock.json', 'project.yml', 'pairing-native/**', 'jit-integration/**') }}
      - name: Prepare FlareStore feed for the packaged IPA
        run: python3 scripts/update_source.py
      - name: Bundle complete source with licenses
        run: |
          cp README.md upstream/EMBERSIGN-README.md
          cp NOTICE.md upstream/EMBERSIGN-NOTICE.md
          mkdir -p upstream/EmberSign-Pairing-Native
          cp pairing-native/Cargo.toml pairing-native/LICENSE upstream/EmberSign-Pairing-Native/
          cp -R pairing-native/src pairing-native/include upstream/EmberSign-Pairing-Native/
          cp scripts/build_pairing.sh upstream/EmberSign-Pairing-Native/
          mkdir -p upstream/EmberSign-StikJIT-Source
          cp build/stikjit-source/LICENSE build/stikjit-source/README.md build/stikjit-source/project.yml upstream/EmberSign-StikJIT-Source/
          cp -R build/stikjit-source/Sources build/stikjit-source/Resources build/stikjit-source/idevice build/stikjit-source/iokit upstream/EmberSign-StikJIT-Source/
          cp scripts/build_stikjit.sh upstream/EmberSign-StikJIT-Source/
          tar --exclude='.git' --exclude='_build' --exclude='deps' -czf packages/EmberSign-Source.tar.gz -C upstream .
      - name: Upload build files and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmberSign-build-${{ github.run_number }}
          path: packages/*
          if-no-files-found: warn
      - name: Publish installable package for personal signing
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1-build.${{ github.run_number }}
          name: EmberSign 0.2.1 build ${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            EmberSign 0.2.1 development build for iOS 16 and later.

            New: Apple Watch IPA preflight under Tools. Inspect Watch companions,
            WidgetKit extensions, and the distinct signing targets before signing.
            Direct Apple Watch signing and installation are NOT yet implemented.

            Adds multiple Apple Account sessions, 2FA, on-device free/paid development provisioning, account/team quotas, certificate/App ID/profile management, paired-device app inventory, uninstall and portal cleanup, automatic re-sign/reinstall attempts, and error-code diagnostics with online issue lookup.

            Also includes imported-certificate signing, IPA installation/export, tweak injection, pairing-file import/export, experimental iOS 27 remote pairing, JIT entitlement preparation, built-in StikJIT activation and StikDebug/SideJITServer fallbacks.

            Re-sign EmberSign.ipa using your current signing tool before installation. Apple Account features depend on Apple developer services and Anisette. Background refresh is best-effort and requires a reachable pairing tunnel. On-device pairing requires iOS 27 and approval in Developer Mode; its support is experimental and device testing is pending. Built-in JIT uses StikJIT and still requires a valid remote pairing record, LocalDevVPN, compatible iOS/device, a development-signed target, and on iOS 26+ an app-compatible JIT memory protocol. It needs real-device verification.

            Complete engine source and original licenses are included in EmberSign-Source.tar.gz. Runtime behavior still needs device testing.
          files: |
            packages/EmberSign.ipa
            packages/EmberSign.ipa.sha256
            packages/build-info.json
            packages/EmberSign-Source.tar.gz
      - name: Update FlareStore feed after successful release
        run: |
          git add source.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Update FlareStore feed for build ${{ github.run_number }} [skip ci]"
            git push origin HEAD:main
          fi
