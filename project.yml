name: Feather
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Feather.xcconfig
  Release: Feather.xcconfig
packages:
  NimbleKit:
    path: NimbleKit
  AltSourceKit:
    path: AltSourceKit
  Zsign:
    path: Zsign
  IDeviceKit:
    path: IDeviceKitten
  Zip:
    url: https://github.com/marmelroy/Zip
    exactVersion: 2.1.2
  SWCompression:
    url: https://github.com/tsolomko/SWCompression
    exactVersion: 4.8.7
  Vapor:
    url: https://github.com/vapor/vapor
    exactVersion: 4.122.3
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 12.8.0
  SideSign:
    url: https://github.com/SideStore/SideSign.git
    revision: 752d1ef602aa792a432ffa1e71646dc1ecf7363c
  AnisetteKit:
    url: https://github.com/mahee96/AnisetteKit.git
    branch: main
targets:
  Feather:
    type: application
    platform: iOS
    sources:
    - path: Feather
      excludes:
      - Resources
    - path: Feather/Resources
      buildPhase: resources
      excludes:
      - Info.plist
    - path: Shared
    settings:
      base:
        PRODUCT_NAME: Feather
        PRODUCT_BUNDLE_IDENTIFIER: $(FEATHER_PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: Feather/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: EmberSign
        INFOPLIST_KEY_UILaunchStoryboardName: Launch Screen.storyboard
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportsDocumentBrowser: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.0'
        SWIFT_OBJC_BRIDGING_HEADER: Feather/Supporting Files/Feather-Bridging-Header.h
        SWIFT_INCLUDE_PATHS: $(inherited) $(SRCROOT)/../pairing-native/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/../build/pairing/lib
        OTHER_LDFLAGS: $(inherited) -lembersign_pairing
        CODE_SIGN_ENTITLEMENTS: Feather/Supporting Files/Feather.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ''
        DEVELOPMENT_TEAM: ''
        MARKETING_VERSION: $(FEATHER_PROJECT_VERSION)
        CURRENT_PROJECT_VERSION: '1'
        SKIP_INSTALL: false
        SUPPORTS_MACCATALYST: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
        SWIFT_EMIT_LOC_STRINGS: false
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
    - package: NimbleKit
      product: NimbleExtensions
    - package: NimbleKit
      product: NimbleJSON
    - package: NimbleKit
      product: NimbleViews
    - package: AltSourceKit
      product: AltSourceKit
    - package: Zsign
      product: Zsign
    - package: IDeviceKit
      product: IDeviceSwift
    - package: Zip
      product: Zip
    - package: SWCompression
      product: SWCompression
    - package: Vapor
      product: Vapor
    - package: Nuke
      product: NukeUI
    - package: SideSign
      product: SideSign
    - package: AnisetteKit
      product: AnisetteKit
    - target: EmberSignWidget
    entitlements:
      path: Feather/Supporting Files/Feather.entitlements
      properties:
        get-task-allow: true
        com.apple.security.application-groups:
        - group.com.soum91.embersign
  EmberSignWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: EmberSignWidget
    - path: Shared
    info:
      path: EmberSignWidget/Info.plist
      properties:
        CFBundleDisplayName: EmberSign
        CFBundleShortVersionString: $(FEATHER_PROJECT_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EmberSignWidget/EmberSignWidget.entitlements
      properties:
        com.apple.security.application-groups:
        - group.com.soum91.embersign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.embersign.widget
        MARKETING_VERSION: $(FEATHER_PROJECT_VERSION)
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '5.0'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: 1,2
        CODE_SIGNING_ALLOWED: false
        CODE_SIGN_IDENTITY: ''
schemes:
  Feather:
    build:
      targets:
        Feather: all
    run:
      config: Debug
    archive:
      config: Release
