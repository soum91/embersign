name: Feather
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Feather.xcconfig
  Release: Feather.xcconfig
packages:
  NimbleKit:
    path: NimbleKit
  AltSourceKit:
    path: AltSourceKit
  Zsign:
    path: Zsign
  IDeviceKit:
    path: IDeviceKitten
  Zip:
    url: https://github.com/marmelroy/Zip
    exactVersion: 2.1.2
  SWCompression:
    url: https://github.com/tsolomko/SWCompression
    exactVersion: 4.8.7
  Vapor:
    url: https://github.com/vapor/vapor
    exactVersion: 4.104.0
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 12.8.0
  SideSign:
    url: https://github.com/SideStore/SideSign.git
    revision: 752d1ef602aa792a432ffa1e71646dc1ecf7363c
targets:
  Feather:
    type: application
    platform: iOS
    sources:
      - path: Feather
        excludes: [Resources]
      - path: Feather/Resources
        buildPhase: resources
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_NAME: Feather
        PRODUCT_BUNDLE_IDENTIFIER: $(FEATHER_PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: Feather/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EmberSign
        INFOPLIST_KEY_UILaunchStoryboardName: Launch Screen.storyboard
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Feather/Supporting Files/Feather-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Feather/Supporting Files/Feather.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: $(FEATHER_PROJECT_VERSION)
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
      - package: NimbleKit
        product: NimbleExtensions
      - package: NimbleKit
        product: NimbleJSON
      - package: NimbleKit
        product: NimbleViews
      - package: AltSourceKit
        product: AltSourceKit
      - package: Zsign
        product: Zsign
      - package: IDeviceKit
        product: IDeviceSwift
      - package: Zip
        product: Zip
      - package: SWCompression
        product: SWCompression
      - package: Vapor
        product: Vapor
      - package: Nuke
        product: NukeUI
      - package: SideSign
        product: SideSign
schemes:
  Feather:
    build:
      targets:
        Feather: all
    run:
      config: Debug
    archive:
      config: Release
